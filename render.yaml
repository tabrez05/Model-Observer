# Render Blueprint — deploys API + Frontend + PostgreSQL + Redis for free
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── Redis (Key Value) ──────────────────────────────────────────────────────
  - type: redis
    name: model-observer-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []            # only allow internal Render network

  # ── FastAPI backend ────────────────────────────────────────────────────────
  - type: web
    name: model-observer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: model-observer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: model-observer-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://model-observer-frontend.onrender.com
      - key: MINIO_ENDPOINT
        value: ""
    buildFilter:
      paths:
        - backend/**

  # ── React frontend (nginx) ─────────────────────────────────────────────────
  - type: web
    name: model-observer-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    buildFilter:
      paths:
        - frontend/**

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: model-observer-db
    plan: free
    databaseName: ml_tracker
    user: ml_tracker
