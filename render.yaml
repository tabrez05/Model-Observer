# Render Blueprint — deploys API + Frontend for free
# Docs: https://render.com/docs/blueprint-spec
#
# Setup:
#   1. Go to https://dashboard.render.com/blueprints
#   2. Connect your GitHub repo (tabrez05/Model-Observer)
#   3. Render reads this file and creates all services automatically

services:

  # ── FastAPI backend ────────────────────────────────────────────────────────
  - type: web
    name: model-observer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ""          # uses Dockerfile CMD (gunicorn production stage)
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: model-observer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: model-observer-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure random value
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://model-observer-frontend.onrender.com
      - key: MINIO_ENDPOINT
        value: ""              # MinIO not available on free tier; disable artifact uploads
    buildFilter:
      paths:
        - backend/**

  # ── React frontend ─────────────────────────────────────────────────────────
  - type: web
    name: model-observer-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: model-observer-api
          type: web
          property: host
    buildFilter:
      paths:
        - frontend/**

databases:
  # ── PostgreSQL (free 90-day trial, then $7/mo) ─────────────────────────────
  - name: model-observer-db
    plan: free
    databaseName: ml_tracker
    user: ml_tracker

# Note: Render free Redis is via Upstash integration — add manually after deploy:
# Dashboard → model-observer-api → Environment → Add REDIS_URL from Upstash
