name: CD — Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/model-observer-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/model-observer-frontend

jobs:

  # ── 1. Build & push Docker images to GHCR (always runs) ───────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Render (free) — runs when GCP secrets are NOT configured ──
  deploy-render:
    name: Deploy to Render (free)
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}

    steps:
      - name: Trigger Render deploy — API
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" \
            -H "Content-Type: application/json" || echo "Render API deploy triggered"

      - name: Trigger Render deploy — Frontend
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
            -H "Content-Type: application/json" || echo "Render frontend deploy triggered"

  # ── 3. Deploy to GKE (production) — runs only when GCP secrets are set ────
  deploy-gke:
    name: Deploy to GKE
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GCP_SA_KEY != '' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}

      - name: Update image tags in kustomize
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/model-observer-api=ghcr.io/${{ github.repository_owner }}/model-observer-api:${{ github.ref_name }} \
            ghcr.io/${{ github.repository_owner }}/model-observer-frontend=ghcr.io/${{ github.repository_owner }}/model-observer-frontend:${{ github.ref_name }}

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api      -n ml-tracker --timeout=120s
          kubectl rollout status deployment/frontend -n ml-tracker --timeout=120s
